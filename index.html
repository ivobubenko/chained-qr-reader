<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure QR Scanner</title>
    <!-- mobile-friendly viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      body {
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        margin: 0;
        background: #000;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      #scanner-mount {
        width: 100%;
        height: 100%;
      }

      #scanner-mount > iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <main id="app">
      <div id="scanner-mount"></div>
    </main>

    <script type="module">
      import { Runner, readCoseContent, createUiIframe } from "./dist/secure-qr-scanner.es.js";

      const qrPattern = "QR1:";
      const buildDeepLinkPrefix = () => {
        const url = new URL(window.location.href);
        url.search = "";
        url.hash = "";
        return `${url.href}?cose1=`;
      };
      const deepLinkPrefix = buildDeepLinkPrefix();

      const stripDeepLink = ({ text = "", prefix }) => {
        const value = String(text);
        return { text: value.startsWith(prefix) ? value.slice(prefix.length) : value };
      };

      const chainJwk = new Runner().execute(readCoseContent, {
        jwkBase: "https://d2hnybskbnod8e.cloudfront.net/",
      });

      const chainDeep = new Runner()
        .execute(stripDeepLink, {
          prefix: deepLinkPrefix,
        })
        .execute(readCoseContent, {
          jwkBase: "https://d2hnybskbnod8e.cloudfront.net/",
        });

      const securityChain = [
        {
          pattern: qrPattern,
          securityChain: chainJwk,
        },
        {
          pattern: `${deepLinkPrefix}${qrPattern}`,
          securityChain: chainDeep,
        },
        { pattern: "", securityChain: new Runner() },
      ];

      const scannerIframe = await createUiIframe(securityChain, {
        scannerModuleUrls: [new URL("./dist/secure-qr-scanner.es.js", import.meta.url).href],
        expectedOrigin: window.location.origin,
        iframeStyle: "width:100%;height:100%;border:0;display:block;background:transparent;",
        parentTargetOrigin: "*",
        parentMessageType: "secure-qr-scan-result",
      });
      document.getElementById("scanner-mount").appendChild(scannerIframe);
    </script>
  </body>
</html>
