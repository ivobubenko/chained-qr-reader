<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure QR Scanner - Unisolated UI</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      body {
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        margin: 0;
        background: #000;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      #scanner-mount {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <main id="app">
      <div id="scanner-mount"></div>
    </main>

    <script type="module">
      import {
        readCoseContent,
        createUiDiv,
        FunctionChainer,
      } from "./dist/secure-qr-scanner.es.js";

      const qrPattern = "QR1:";
      const buildDeepLinkPrefix = () => {
        const url = new URL(window.location.href);
        url.search = "";
        url.hash = "";
        return `${url.href}?cose1=`;
      };
      const deepLinkPrefix = buildDeepLinkPrefix();

      const stripDeepLink = ({ text = "", prefix }) => {
        const value = String(text);
        return { text: value.startsWith(prefix) ? value.slice(prefix.length) : value };
      };

      const securityChain = new FunctionChainer([
        {
          pattern: qrPattern,
          functions: [
            {
              fn: readCoseContent,
              context: {
                jwkBase: "https://d2hnybskbnod8e.cloudfront.net/",
              },
            },
          ],
        },
        {
          pattern: `${deepLinkPrefix}${qrPattern}`,
          functions: [
            { fn: stripDeepLink, context: { prefix: deepLinkPrefix } },
            { fn: readCoseContent, context: { jwkBase: "https://d2hnybskbnod8e.cloudfront.net/" } },
          ],
        },
        {
          pattern: "",
          functions: [{ fn: () => {}, context: {} }],
        },
      ]);

      const scannerUi = await createUiDiv(securityChain, {
        containerStyle:
          "width:100%;height:100%;max-width:600px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;",
        videoStyle: "width:100%;max-width:600px;height:auto;background:#000;border-radius:8px;",
        controlsStyle: "display:flex;gap:8px;flex-wrap:wrap;justify-content:center;",
        buttonStyle: "padding:10px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;",
        messageStyle:
          "margin:0;max-width:600px;font:12px/1.4 sans-serif;color:#d00;text-align:center;display:none;",
        parentTargetOrigin: "*",
        parentMessageType: "secure-qr-scan-result",
      });

      document.getElementById("scanner-mount").appendChild(scannerUi);
    </script>
  </body>
</html>
